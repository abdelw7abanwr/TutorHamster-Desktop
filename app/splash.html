<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TutorHamster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --apple-blue: #0071e3;
      --apple-blue-hover: #0077ed;
      --apple-indigo: #4f46e5;
      --apple-bg: #ffffff;
      --apple-surface: #f5f5f7;
      --apple-border: rgba(0, 0, 0, 0.08);
      --apple-border-subtle: rgba(0, 0, 0, 0.05);
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-muted: #86868b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      font-family: 'Baloo Bhaijaan 2', -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background: transparent;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Apple-style Crisp White Window */
    .splash-container {
      width: 820px;
      height: 510px;
      background: #ffffff;
      border: 1px solid var(--apple-border);
      border-radius: 28px;
      box-shadow: 
        0 30px 70px -15px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(0, 0, 0, 0.04),
        0 8px 20px -6px rgba(0, 0, 0, 0.06);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 36px 22px;
    }

    /* Ambient Subtle Lighting */
    .ambient-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-top {
      width: 320px;
      height: 320px;
      background: rgba(0, 113, 227, 0.06);
      top: -120px;
      right: 40px;
    }
    .glow-bottom {
      width: 280px;
      height: 280px;
      background: rgba(79, 70, 229, 0.05);
      bottom: -100px;
      left: 20px;
    }

    /* macOS Traffic Lights Header */
    .window-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .traffic-lights {
      display: flex;
      gap: 8px;
    }

    .traffic-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .traffic-dot.close { background: #ff5f56; border: 0.5px solid #e0443e; }
    .traffic-dot.minimize { background: #ffbd2e; border: 0.5px solid #dea123; }
    .traffic-dot.maximize { background: #27c93f; border: 0.5px solid #1aab29; }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(0, 113, 227, 0.06);
      border: 1px solid rgba(0, 113, 227, 0.15);
      border-radius: 20px;
      color: var(--apple-blue);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .brand-pill svg {
      width: 14px;
      height: 14px;
      color: var(--apple-blue);
    }

    /* Main Grid Split */
    .content-wrapper {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.25fr 0.9fr;
      gap: 24px;
      align-items: center;
      flex: 1;
    }

    /* Left Area: Apple Typography & Information */
    .text-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .app-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .app-title {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.12;
      color: var(--text-primary);
      letter-spacing: -0.6px;
    }

    .tagline {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Apple macOS Segmented Controls (Roles Pills) - No Line Breaks */
    .roles-segmented {
      display: inline-flex;
      background: rgba(120, 120, 128, 0.08);
      padding: 3px;
      border-radius: 12px;
      border: 1px solid var(--apple-border-subtle);
      gap: 3px;
      width: fit-content;
      max-width: 100%;
      margin-top: 2px;
    }

    .role-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .role-item svg {
      width: 15px;
      height: 15px;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .role-item.active {
      background: #ffffff;
      color: var(--text-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1), 0 1px 2px rgba(0, 0, 0, 0.05);
      font-weight: 700;
    }

    /* Typewriter Box with Apple clean card */
    .typing-box {
      min-height: 62px;
      background: var(--apple-surface);
      border: 1px solid var(--apple-border-subtle);
      border-radius: 14px;
      padding: 11px 15px;
      display: flex;
      align-items: center;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
      margin-top: 4px;
    }

    .typed-text {
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--text-primary);
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 18px;
      background: var(--apple-blue);
      margin: 0 3px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
      border-radius: 2px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Right Area: Illustration Showcase */
    .illustration-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .image-frame {
      width: 100%;
      max-width: 330px;
      height: 280px;
      overflow: hidden;
      background: transparent;
      border: none;
      box-shadow: none;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Authentic Apple Loading Activity Spinner */
    .apple-spinner {
      position: relative;
      width: 17px;
      height: 17px;
      display: inline-block;
      flex-shrink: 0;
    }
    .apple-spinner div {
      width: 9%;
      height: 26%;
      background: var(--text-secondary);
      position: absolute;
      left: 45.5%;
      top: 37%;
      opacity: 0;
      border-radius: 50px;
      animation: appleFade 1.2s linear infinite;
    }
    .apple-spinner .bar1  { transform: rotate(0deg) translate(0, -135%); animation-delay: 0s; }
    .apple-spinner .bar2  { transform: rotate(30deg) translate(0, -135%); animation-delay: -1.1s; }
    .apple-spinner .bar3  { transform: rotate(60deg) translate(0, -135%); animation-delay: -1.0s; }
    .apple-spinner .bar4  { transform: rotate(90deg) translate(0, -135%); animation-delay: -0.9s; }
    .apple-spinner .bar5  { transform: rotate(120deg) translate(0, -135%); animation-delay: -0.8s; }
    .apple-spinner .bar6  { transform: rotate(150deg) translate(0, -135%); animation-delay: -0.7s; }
    .apple-spinner .bar7  { transform: rotate(180deg) translate(0, -135%); animation-delay: -0.6s; }
    .apple-spinner .bar8  { transform: rotate(210deg) translate(0, -135%); animation-delay: -0.5s; }
    .apple-spinner .bar9  { transform: rotate(240deg) translate(0, -135%); animation-delay: -0.4s; }
    .apple-spinner .bar10 { transform: rotate(270deg) translate(0, -135%); animation-delay: -0.3s; }
    .apple-spinner .bar11 { transform: rotate(300deg) translate(0, -135%); animation-delay: -0.2s; }
    .apple-spinner .bar12 { transform: rotate(330deg) translate(0, -135%); animation-delay: -0.1s; }

    @keyframes appleFade {
      from { opacity: 1; }
      to { opacity: 0.15; }
    }

    /* Apple macOS Capsule Progress Bar */
    .splash-footer {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 4px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .status-text-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-percentage {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      width: 100%;
      height: 4.5px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0071e3, #4f46e5);
      border-radius: 999px;
      box-shadow: 0 0 6px rgba(0, 113, 227, 0.4);
      transition: width 0.08s linear;
    }

    /* Apple-style Permission Modal Sheet */
    .permission-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .permission-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .permission-modal {
      width: 440px;
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid var(--apple-border);
      box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(0, 0, 0, 0.05);
      padding: 24px 26px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      transform: scale(0.94);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .permission-backdrop.active .permission-modal {
      transform: scale(1);
    }

    .modal-icons-row {
      display: flex;
      gap: 12px;
    }

    .modal-icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-icon-badge.mic {
      background: rgba(0, 113, 227, 0.1);
      color: var(--apple-blue);
    }
    .modal-icon-badge.cam {
      background: rgba(79, 70, 229, 0.1);
      color: var(--apple-indigo);
    }
    .modal-icon-badge svg {
      width: 22px;
      height: 22px;
      stroke-width: 2;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.25;
    }

    .modal-desc {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
      font-weight: 500;
      margin-top: -4px;
    }

    .modal-actions {
      display: flex;
      width: 100%;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-modal {
      flex: 1;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      outline: none;
    }

    .btn-modal.btn-primary {
      background: var(--apple-blue);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
    }
    .btn-modal.btn-primary:hover {
      background: var(--apple-blue-hover);
      box-shadow: 0 6px 16px rgba(0, 113, 227, 0.4);
    }

    .btn-modal.btn-secondary {
      background: var(--apple-surface);
      color: var(--text-secondary);
      border: 1px solid var(--apple-border-subtle);
    }
    .btn-modal.btn-secondary:hover {
      background: #e5e5ea;
      color: var(--text-primary);
    }

    /* RTL Support */
    html[dir="rtl"] {
      direction: rtl;
    }
    html[dir="rtl"] .traffic-lights {
      flex-direction: row-reverse;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <!-- Ambient Subtle Glows -->
    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>

    <!-- macOS Traffic Lights Header & Brand Badge -->
    <div class="window-header">
      <div class="traffic-lights">
        <span class="traffic-dot close"></span>
        <span class="traffic-dot minimize"></span>
        <span class="traffic-dot maximize"></span>
      </div>

      <div class="brand-pill">
        <img src="../assets/icons/logo-v1-drop-rounded.svg" alt="TutorHamster" style="width: 16px; height: 16px; border-radius: 4px; display: block;" />
        <span id="badge-text"></span>
      </div>
    </div>

    <!-- Main Grid Content -->
    <div class="content-wrapper">
      <!-- Left Column: Apple Typography & Information -->
      <div class="text-area">
        <div class="app-title-group">
          <h1 class="app-title" id="app-title">TutorHamster</h1>
          <p class="tagline" id="app-tagline"></p>
        </div>

        <!-- Apple Segmented Role Control with Heroicons -->
        <div class="roles-segmented">
          <!-- Students Pill (Heroicon: Academic Cap) -->
          <div class="role-item" id="pill-students">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5" />
            </svg>
            <span id="pill-students-text"></span>
          </div>

          <!-- Teachers Pill (Heroicon: User Group) -->
          <div class="role-item" id="pill-teachers">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
            </svg>
            <span id="pill-teachers-text"></span>
          </div>

          <!-- Administration Pill (Heroicon: Building Office) -->
          <div class="role-item" id="pill-admin">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21" />
            </svg>
            <span id="pill-admin-text"></span>
          </div>
        </div>

        <!-- Animated Typing Feature Explanation -->
        <div class="typing-box">
          <span class="typed-text" id="typed-text"></span>
          <span class="cursor"></span>
        </div>
      </div>

      <!-- Right Column: Illustration Showcase -->
      <div class="illustration-card">
        <div class="image-frame">
          <img src="../assets/splash.svg" alt="Educational Illustration" />
        </div>
      </div>
    </div>

    <!-- Apple-style Footer / Authentic Apple Loading Spinner & Progress -->
    <div class="splash-footer">
      <div class="progress-meta">
        <div class="status-text-wrap">
          <!-- Authentic 12-Blade Apple Activity Indicator Spinner -->
          <div class="apple-spinner">
            <div class="bar1"></div>
            <div class="bar2"></div>
            <div class="bar3"></div>
            <div class="bar4"></div>
            <div class="bar5"></div>
            <div class="bar6"></div>
            <div class="bar7"></div>
            <div class="bar8"></div>
            <div class="bar9"></div>
            <div class="bar10"></div>
            <div class="bar11"></div>
            <div class="bar12"></div>
          </div>
          <span id="loading-status"></span>
        </div>
        <span class="progress-percentage" id="progress-percentage">0%</span>
      </div>

      <!-- Apple macOS Capsule Progress Bar -->
      <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
    </div>

    <!-- Apple-style Permission Dialog Modal for Camera & Mic -->
    <div class="permission-backdrop" id="permission-modal">
      <div class="permission-modal">
        <!-- Badges Row: Microphone and Camera Icons -->
        <div class="modal-icons-row">
          <div class="modal-icon-badge mic" title="Microphone">
            <!-- Heroicon: Microphone -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z" />
            </svg>
          </div>
          <div class="modal-icon-badge cam" title="Camera">
            <!-- Heroicon: Video Camera -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z" />
            </svg>
          </div>
        </div>

        <h2 class="modal-title" id="perm-title"></h2>
        <p class="modal-desc" id="perm-desc"></p>

        <div class="modal-actions">
          <button class="btn-modal btn-primary" id="btn-perm-grant"></button>
          <button class="btn-modal btn-secondary" id="btn-perm-later"></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Strictly load translations from the external locales files (Single Source of Truth)
    const lang = window.splashLocale;

    // Apply Direction and Language Code
    document.documentElement.setAttribute('lang', lang.lang || 'en');
    document.documentElement.setAttribute('dir', lang.dir || 'ltr');

    // Populate all localized strings directly from the active locale JSON
    document.getElementById('badge-text').innerText = lang.badge;
    document.getElementById('app-title').innerText = lang.title;
    document.getElementById('app-tagline').innerText = lang.tagline;
    document.getElementById('pill-students-text').innerText = lang.students;
    document.getElementById('pill-teachers-text').innerText = lang.teachers;
    document.getElementById('pill-admin-text').innerText = lang.admin;
    document.getElementById('loading-status').innerText = lang.loading;

    // Populate Permission Modal Localized Strings
    document.getElementById('perm-title').innerText = lang.permTitle;
    document.getElementById('perm-desc').innerText = lang.permDesc;
    document.getElementById('btn-perm-grant').innerText = lang.permGrant;
    document.getElementById('btn-perm-later').innerText = lang.permLater;

    // Typewriter Engine
    const typedTextEl = document.getElementById('typed-text');
    const pills = {
      students: document.getElementById('pill-students'),
      teachers: document.getElementById('pill-teachers'),
      admin: document.getElementById('pill-admin')
    };

    let featureIndex = 0;
    let charIndex = 0;
    let isDeleting = false;

    function highlightPill(role) {
      Object.keys(pills).forEach(key => {
        if (key === role) {
          pills[key].classList.add('active');
        } else {
          pills[key].classList.remove('active');
        }
      });
    }

    function typeWriter() {
      const currentFeature = lang.features[featureIndex % lang.features.length];
      const text = currentFeature.text;

      if (!isDeleting) {
        highlightPill(currentFeature.role);
        typedTextEl.innerText = text.substring(0, charIndex + 1);
        charIndex++;

        if (charIndex === text.length) {
          isDeleting = true;
          setTimeout(typeWriter, 1400); // Pause while reading
          return;
        }
        setTimeout(typeWriter, 35);
      } else {
        typedTextEl.innerText = text.substring(0, charIndex - 1);
        charIndex--;

        if (charIndex <= 0) {
          isDeleting = false;
          featureIndex++;
          setTimeout(typeWriter, 200);
          return;
        }
        setTimeout(typeWriter, 18);
      }
    }

    typeWriter();

    // 10-Second Progress Bar Timer
    const TOTAL_DURATION_MS = 10000;
    const startTime = Date.now();
    const progressBar = document.getElementById('progress-bar');
    const progressPercentage = document.getElementById('progress-percentage');
    const statusText = document.getElementById('loading-status');

    const progressInterval = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(100, Math.floor((elapsed / TOTAL_DURATION_MS) * 100));

      progressBar.style.width = progress + '%';
      progressPercentage.innerText = progress + '%';

      if (progress >= 95) {
        statusText.innerText = lang.ready;
      }

      if (elapsed >= TOTAL_DURATION_MS) {
        clearInterval(progressInterval);
      }
    }, 50);

    // Camera & Microphone Permission Popup Logic
    const permissionModal = document.getElementById('permission-modal');
    const btnGrant = document.getElementById('btn-perm-grant');
    const btnLater = document.getElementById('btn-perm-later');

    // Check if permission was already decided in this installation
    const currentPermission = localStorage.getItem('tutor_media_permission');

    if (!currentPermission) {
      // Show modal after 1.5s for an elegant entrance
      setTimeout(() => {
        permissionModal.classList.add('active');
      }, 1500);
    }

    function closeModal() {
      permissionModal.classList.remove('active');
    }

    btnGrant.addEventListener('click', async () => {
      localStorage.setItem('tutor_media_permission', 'granted');
      if (window.splashAPI && window.splashAPI.sendPermissionResponse) {
        window.splashAPI.sendPermissionResponse('granted');
      }

      // Trigger standard getUserMedia request to authorize devices
      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
          // Stop immediately after granting permission
          stream.getTracks().forEach(track => track.stop());
        }
      } catch (err) {
        console.log('User media requested:', err.message);
      }

      closeModal();
    });

    btnLater.addEventListener('click', () => {
      localStorage.setItem('tutor_media_permission', 'later');
      if (window.splashAPI && window.splashAPI.sendPermissionResponse) {
        window.splashAPI.sendPermissionResponse('later');
      }
      closeModal();
    });
  </script>
</body>
</html>
